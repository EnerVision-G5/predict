# Configuration commune aux quatre services.
#
# Elle ne porte aucun secret : les valeurs sensibles et celles qui changent
# d'une machine à l'autre sont écrites `${VARIABLE}` et résolues dans
# l'environnement au chargement. Un `${VARIABLE:-defaut}` accepte une valeur
# de repli, un `${VARIABLE}` sans repli est obligatoire et fait échouer le
# démarrage s'il manque.
#
# Ce fichier est la couche de base. `conf/{PREDICT_ENV}.yaml` se superpose à
# lui clé par clé, sans jamais le remplacer en bloc : une surcharge locale
# n'a à écrire que ce qu'elle change.

storage:
  # Racine des partitions de variables. Un chemin local en développement, une
  # URI s3:// vers Garage en déploiement. Les deux traversent le même code :
  # voir predict_common/io.py.
  #
  # La couche brute n'est pas ici : c'est la table `mesure`, plus bas.
  root: ${PREDICT_STORAGE_ROOT:-data}

database:
  # Couche brute de la chaîne. Le collecteur y écrit les mesures de la source,
  # l'ETL les y relit et y repose ce qu'il en déduit. La base est fournie par
  # api/enervision-db, qui détient le schéma figé v1.0.
  #
  # Le repli est vide et non une URL de développement : une valeur par défaut
  # ferait démarrer le collecteur contre une base qui n'existe pas, et l'échec
  # arriverait à la première écriture au lieu du démarrage.
  url: ${DATABASE_URL:-}
  # Taille des lots d'insertion. Une journée de sept sites à la minute fait une
  # dizaine de milliers de lignes : les soumettre d'un bloc ferait un paquet
  # que le driver doit entièrement matérialiser.
  batch_size: 1000

source:
  # API Mock IoT. Le port fait partie de la valeur : aucune adresse n'est en
  # dur dans le code, le collecteur concatène cette URL et le chemin.
  base_url: ${MOCK_API_URL:-http://localhost:8000}
  sites_path: /api/v1/sites
  # Le site est un paramètre de requête, pas un segment de chemin : c'est le
  # contrat de la source, qui expose une seule route d'historique.
  readings_path: /api/v1/readings
  current_path: /api/v1/sites/{site_id}/current
  # Simulation de pic : la seule route en écriture de la source. Relayée par
  # le service d'inférence pour le compte de l'API métier, qui doit pouvoir
  # déclencher un pic depuis le dashboard sans connaître la source.
  simulate_spike_path: /api/v1/simulate/spike/{site_id}
  # Alertes actives de la source. Le collecteur les journalise : la source ne
  # sert que les alertes en cours, une alerte résolue disparaît de sa réponse.
  alerts_path: /api/v1/alerts
  # État de santé des capteurs, par site. Dit quel capteur est tombé et
  # jusqu'à quand, ce qu'aucune mesure ne porte.
  sensors_status_path: /api/v1/sensors/status
  # Largeur maximale d'une fenêtre de rattrapage, EN MINUTES, plafonnée à
  # 1000 par la source.
  #
  # C'est la même valeur que le `limit` envoyé, et ce n'est pas un hasard :
  # `/api/v1/readings` définit `limit` comme le nombre de résultats rendus,
  # répartis uniformément sur la fenêtre demandée. Un résultat par minute
  # exige donc autant de résultats que de minutes, et la fenêtre ne peut pas
  # être plus large que le plafond de la source.
  #
  # Une journée fait 1440 minutes : elle est demandée en deux fenêtres, jamais
  # en une. La demander d'un bloc avec limit=1000 rendrait mille points étalés
  # sur 1440 minutes — un point toutes les 86 secondes, sans qu'aucune erreur
  # ne le signale.
  page_size: 1000
  timeout_s: 30
  # Reprises immédiates d'un appel avant abandon, et attente entre deux
  # tentatives. L'attente croît avec le rang de la tentative.
  retries: 3
  backoff_s: 2
  # Débit maximal sortant, en requêtes par seconde. 0 lève la limite. La
  # borne protège la source, pas le collecteur : un rattrapage sur 7 sites
  # et 90 jours envoie des milliers de pages.
  rate_limit_rps: 10

collector:
  # Cadence d'interrogation de /current en mode continu. La source produit
  # une mesure par minute et par site : descendre plus bas relit la même
  # valeur, monter plus haut en perd.
  poll_interval_s: 60
  # Timeout d'un appel à /current. Plus court que source.timeout_s : un site
  # muet ne doit pas retarder les six autres au-delà de leur cadence.
  poll_timeout_s: 10
  # Seuil de retard d'ingestion au-delà duquel le journal passe en WARNING.
  # Trois cadences manquées : en deçà, un à-coup de la source alerterait sans
  # qu'aucune donnée ne soit perdue.
  lag_warning_s: 180
  # Fenêtre dans laquelle le rattrapage automatique (`--catch-up`) cherche les
  # trous, en journées.
  #
  # 2 et non 35, parce que la source ne sert pas d'historique : son
  # `/api/v1/readings` ne remonte qu'à 48 heures, et au-delà elle répond des
  # mesures nulles plutôt qu'une erreur. Une fenêtre plus large ne collectait
  # donc rien, mais interrogeait quand même la source pour chaque journée et
  # chaque site, et écrivait des nuls que le `ON CONFLICT DO NOTHING` fige
  # ensuite définitivement.
  #
  # 2 journées couvrent les 48 heures utiles. L'historique d'apprentissage ne
  # vient pas de là : il est chargé depuis les jeux de données de référence.
  catch_up_days: ${COLLECTOR_CATCH_UP_DAYS:-2}

etl:
  # Version du jeu de variables. Elle est dans le chemin des partitions, donc
  # deux versions coexistent sans se recouvrir et un modèle entraîné sur v1
  # reste reproductible après la sortie de v2. La changer est un acte
  # délibéré : voir services/etl/src/etl/features.py.
  feature_version: v1
  # Pas de rééchantillonnage de la série. La source produit à la minute, le
  # modèle prédit à l'heure.
  resample_rule: 1h
  # Décalages retenus comme variables explicatives : l'heure précédente porte
  # l'inertie thermique, 24 h et 168 h les saisonnalités journalière et
  # hebdomadaire des sites tertiaires.
  lag_hours: [1, 24, 168]
  # Fenêtre de la moyenne glissante, en heures.
  rolling_window_h: 24

training:
  experiment: ${MLFLOW_EXPERIMENT:-enervision-consumption}
  registered_model: enervision_xgboost
  # Découpe temporelle, jamais aléatoire : une coupe au hasard laisserait le
  # modèle voir le futur d'une même journée pendant l'apprentissage.
  valid_ratio: 0.15
  test_ratio: 0.15
  # Part maximale d'imputation tolérée dans la cible d'une heure. Au-delà,
  # l'heure décrit surtout ce que l'ETL a reconstruit : l'apprendre
  # reviendrait à apprendre l'interpolation.
  max_imputed_ratio: 0.5
  params:
    n_estimators: 600
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.9
    random_state: 42
  # Arrêt anticipé sur le jeu de validation, en nombre de tours sans gain.
  early_stopping_rounds: 50

  # Banc d'arbitrage : la fenêtre où TOUS les candidats sont réévalués, et
  # qu'aucun n'apprend. Sans elle, chaque run mesurait sa qualité sur son
  # propre bloc de test, découpé dans sa propre fenêtre : deux entraînements
  # espacés d'une semaine produisaient deux MAE que rien n'autorisait à
  # comparer, ce qu'on faisait pourtant en les regardant côte à côte.
  arbitration:
    # Bornes figées, vides par défaut. Renseignées ENSEMBLE, elles rendent les
    # mesures comparables d'un entraînement à l'autre — c'est ce que la
    # promotion exige pour opposer un challenger au champion en place. Les
    # laisser vides donne un banc glissant, qui ne compare que les candidats
    # d'un même run entre eux.
    start: ${TRAINING_BENCH_START:-}
    end: ${TRAINING_BENCH_END:-}
    # Profondeur du banc glissant, en journées. Deux semaines : assez pour que
    # la mesure ne dépende pas d'une seule journée atypique, assez court pour
    # ne pas amputer l'apprentissage de sa période la plus récente, qui est
    # aussi la plus proche de ce qu'il faudra prédire.
    days: 14

  # Familles opposées par `--challenge`, avec leurs hyperparamètres. XGBoost
  # n'y figure pas : c'est le candidat que l'entraînement ordinaire apprend,
  # ses hyperparamètres sont dans `params` ci-dessus, et les écrire deux fois
  # les ferait diverger. ADR-010 compare trois options — une baseline simple,
  # XGBoost, un réseau séquentiel ; les deux premières sont ici, la troisième
  # a été écartée pour son coût sur le serveur on-premise.
  candidates:
    foret-aleatoire:
      n_estimators: 300
      max_depth: 12
      random_state: 42
      n_jobs: -1
    ridge:
      alpha: 1.0

  promotion:
    # Dégradation tolérée sur le banc, en proportion de l'erreur du champion.
    # 0 : le candidat doit au moins l'égaler. Monter ce seuil accepte de
    # servir un modèle moins bon, ce qui ne se décide pas à la légère — d'où
    # la valeur la plus stricte par défaut.
    margin: ${PROMOTION_MARGIN:-0.0}

monitoring:
  # Expérience où atterrissent les mesures d'écart. Séparée de celle des
  # entraînements : mélanger les deux rendrait illisible la comparaison entre
  # modèles, chaque run de surveillance venant s'y intercaler.
  experiment: ${MLFLOW_DRIFT_EXPERIMENT:-enervision-drift}

  # Profondeur évaluée par défaut, en journées. Une semaine : assez pour que
  # l'erreur moyenne ne dépende pas d'une seule journée atypique, assez court
  # pour qu'une dérive installée depuis trois jours se voie encore.
  window_days: 7

  # Seuil d'alerte, exprimé en RAPPORT à l'erreur du modèle sur son jeu de
  # test au moment de l'entraînement — et non en kilowatts. Un seuil absolu
  # vaudrait pour un site de 200 kW et serait absurde pour un autre de 1000,
  # et il faudrait le réviser à chaque réentraînement. Le rapport, lui, suit
  # le modèle : promouvoir une autre version change la référence du même geste.
  #
  # 1.5 tolère 50 % de dégradation. En dessous de 1.2, le bruit d'une semaine
  # calme suffit à déclencher ; au-delà de 2, on ne détecte plus qu'une panne.
  mae_alert_ratio: ${DRIFT_ALERT_RATIO:-1.5}

  # En deçà, l'écart mesuré ne veut rien dire : une poignée d'heures suffit à
  # faire dire n'importe quoi à une moyenne. Le run est alors journalisé sans
  # verdict plutôt que de produire une alerte que personne ne saura lire.
  #
  # 168 et non 24 depuis la découpe par site. La fenêtre porte sept sites :
  # 24 lignes toutes confondues, c'est trois heures par site, ce qui ne fonde
  # aucun verdict d'ensemble. 168 est une semaine d'un site, le plus petit
  # volume où une moyenne globale commence à vouloir dire quelque chose.
  min_rows: 168

  # Plancher du verdict d'un site pris seul. Il mord bien plus tôt que le
  # précédent, et c'est normal : il compte les heures d'UN site. Une journée
  # complète est le minimum, faute de quoi le cycle jour/nuit à lui seul
  # décide de la moyenne.
  min_rows_per_site: 24

serving:
  # Clé de service exigée sur les routes du contrat. Le service relaie la
  # simulation de pic, qui ÉCRIT sur la source : l'API métier protège la même
  # opération derrière le rôle `writer`, et un service ouvert rendait ce
  # contrôle contournable. Voir services/serving/src/serving/auth.py pour ce
  # qui reste servi sans clé — la sonde de vivacité et la spécification.
  #
  # Sans repli, et volontairement : le service refuse de démarrer sans elle,
  # comme l'API métier refuse de démarrer sans JWT_SECRET. Générer avec
  #   python -c "import secrets; print(secrets.token_urlsafe(48))"
  api_key: ${SERVING_API_KEY:-}
  # false ouvre les routes. C'est le mode du poste de développement et de la
  # CI, où aucun secret n'est distribué ; il est journalisé en avertissement à
  # chaque démarrage et ne doit jamais être déployé.
  auth_enabled: ${SERVING_AUTH_ENABLED:-true}
  # Alias et non version figée : promouvoir un modèle se fait en déplaçant
  # l'alias dans MLflow, sans redéployer le service, et le retour arrière est
  # le même geste en sens inverse.
  model_uri: ${SERVING_MODEL_URI:-models:/enervision_xgboost@champion}
  # Durée de conservation des partitions de variables en mémoire, en secondes.
  # Le service relisait le stockage objet à CHAQUE prévision : une fenêtre de
  # dix journées, décompressée et triée, pour en extraire un seul site. L'ETL
  # ne publie qu'une fois par cycle, la relire plus souvent ne peut rien
  # apprendre de neuf. 0 désactive le cache.
  feature_cache_ttl_s: ${SERVING_FEATURE_CACHE_TTL_S:-300}
  # Le service reconstruit les décalages depuis la dernière partition de
  # variables produite par l'ETL. Nombre de jours remontés pour la trouver.
  feature_lookback_days: 10

  # Repli sur l'historique de référence, en nombre d'années remontées.
  #
  # Le modèle réclame 168 heures CONTINUES avant l'heure prédite. La source ne
  # remontant qu'à 48 heures, aucun site ne les a avant une semaine pleine de
  # collecte : le service refusait alors toute prévision, le dashboard restait
  # vide, et les recommandations n'avaient aucune série à lire. Un démarrage
  # de chaîne ressemblait à une panne.
  #
  # Faute d'heures récentes, le service rejoue donc celles de l'historique de
  # référence, décalées d'un nombre entier d'années de 52 SEMAINES — 364 jours,
  # ni 365 ni 366. C'est ce qui fait retomber sur le même jour de la semaine,
  # que le modèle lit par `day_of_week`, `is_weekend` et son décalage de 168 h.
  #
  # Ce repli ne se déclenche JAMAIS quand des heures récentes suffisent, et la
  # réponse le déclare en clair : `history_source: reference` et la date
  # d'origine dans `history_origin`. Un consommateur qui l'ignore afficherait
  # un profil de l'an dernier comme une mesure de cette semaine.
  #
  # 0 désactive le repli, et le service se tait à nouveau tant que la collecte
  # récente ne suffit pas. 2 couvre les deux années du jeu de référence.
  reference_years: ${SERVING_REFERENCE_YEARS:-2}

mlflow:
  tracking_uri: ${MLFLOW_TRACKING_URI:-http://localhost:5000}
