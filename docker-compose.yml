# Pile locale : MLflow, stockage des artefacts, et les quatre services.
#
# Usage : cp .env.example .env  →  docker compose up -d mlflow serving
#
# Deux dépendances ne sont volontairement pas déclarées ici, pour la même
# raison : elles ont déjà une vérité ailleurs, et la dupliquer en donnerait
# deux à maintenir.
#
# L'API Mock IoT est fournie par le formateur, sur une machine ou une IP qui
# change. `MOCK_API_URL_CONTAINER` la désigne, et `host.docker.internal`
# convient quand elle tourne sur la machine hôte.
#
# La base TimescaleDB est portée par api/enervision-db/docker-compose.yml, qui
# détient le schéma figé v1.0. C'est la couche brute de la chaîne : le
# collecteur y écrit, l'ETL y lit et y repose. La dupliquer ici donnerait deux
# vérités sur la table `mesure`. `DATABASE_URL_CONTAINER` la désigne.
#
# Les quatre traitements datés — collector, etl, training, drift — sont
# derrière le profil `jobs`. Sans lui, un `docker compose up` déclencherait une
# collecte, une transformation, un entraînement et une surveillance à chaque
# démarrage de la pile.

x-artifacts: &artifacts
  # Racine des partitions de variables, montée depuis le poste pour qu'on
  # puisse ouvrir les parquet produits sans entrer dans un conteneur. En
  # déploiement, cette valeur devient une URI s3:// vers Garage et le montage
  # disparaît.
  PREDICT_STORAGE_ROOT: ${PREDICT_STORAGE_ROOT:-/app/data}
  # Racine de l'historique de référence. Elle ne suit plus le code : les CSV
  # ne sont ni dans le dépôt ni dans l'image, et le défaut désigne le montage
  # posé sur le service `collector` ci-dessous. En déploiement, cette valeur
  # devient une URI s3:// et le montage disparaît, comme pour les partitions.
  PREDICT_DATASETS_ROOT: ${PREDICT_DATASETS_ROOT:-/app/datasets}
  PREDICT_ENV: ${PREDICT_ENV:-local}
  MLFLOW_TRACKING_URI: http://mlflow:5000
  AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

x-database: &database
  # Couche brute. Le `:?` fait échouer le démarrage en nommant la variable :
  # un conteneur qui partirait sans base écrirait dans le vide et ne le dirait
  # qu'à la première insertion.
  DATABASE_URL: ${DATABASE_URL_CONTAINER:?definir DATABASE_URL_CONTAINER dans .env}

services:
  mlflow:
    build:
      context: .
      dockerfile: services/training/Dockerfile
    container_name: enervision-mlflow
    restart: unless-stopped
    # Le backend store est un SQLite dans le volume mlruns, hors Git : c'est
    # lui qui versionne les runs et les modèles enregistrés. Un file store
    # simple ne suffirait pas, le Model Registry exige une base — et sans
    # registre, le service d'inférence n'aurait pas d'alias à résoudre.
    entrypoint: ["mlflow"]
    command:
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlruns/mlflow.db
      - --artifacts-destination=/mlruns/artifacts
      # MLflow 3 refuse tout en-tête Host qu'il ne reconnaît pas, par
      # protection contre le DNS rebinding, et répond alors 403 « Invalid Host
      # header » — y compris à ses propres clients. Sans cette liste, un
      # conteneur qui appelle `http://mlflow:5000` est rejeté : l'entraînement
      # ne peut pas ouvrir de run, et le service d'inférence ne peut pas
      # résoudre son alias. `localhost` et `127.0.0.1` couvrent la navigation
      # depuis le poste, `mlflow` le réseau interne du compose.
      - --allowed-hosts=${MLFLOW_ALLOWED_HOSTS:-mlflow:5000,localhost:5000,127.0.0.1:5000}
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlruns:/mlruns
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
      interval: 15s
      timeout: 5s
      retries: 5

  collector:
    build:
      context: .
      dockerfile: services/collector/Dockerfile
    container_name: enervision-collector
    # Traitement daté : il s'exécute, il se termine. Le relancer en boucle
    # rejouerait la même journée sans fin.
    restart: "no"
    profiles: ["jobs"]
    environment:
      <<: [*artifacts, *database]
      MOCK_API_URL: ${MOCK_API_URL_CONTAINER:?definir MOCK_API_URL_CONTAINER dans .env}
    volumes:
      # Historique de référence, monté en lecture seule depuis le poste. Il ne
      # rentre plus dans l'image, et sans Garage local c'est le seul chemin
      # par lequel `python -m collector.datasets` le trouve. Avec Garage
      # (profil `garage`), poser PREDICT_DATASETS_ROOT=s3://... rend ce
      # montage sans effet.
      - ./datasets:/app/datasets:ro
    extra_hosts:
      # Linux ne résout pas host.docker.internal par défaut, contrairement à
      # Docker Desktop. La ligne ne sert que si la base ou l'API Mock tournent
      # sur la machine hôte ; avec une IP de réseau, elle est sans effet.
      - "host.docker.internal:host-gateway"

  poller:
    build:
      context: .
      dockerfile: services/collector/Dockerfile
    container_name: enervision-poller
    # Contrairement au collecteur, qui est un traitement daté, le poller est un
    # processus long : s'il sort, c'est un incident, et il doit repartir.
    # unless-stopped et non always, pour qu'un arrêt volontaire de l'exploitant
    # ne soit pas défait au redémarrage du démon Docker.
    restart: unless-stopped
    entrypoint: ["python", "-m", "collector.poller"]
    environment:
      <<: [*artifacts, *database]
      MOCK_API_URL: ${MOCK_API_URL_CONTAINER:?definir MOCK_API_URL_CONTAINER dans .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Le poller n'expose pas de port : sa santé se lit dans son journal. On
    # laisse Docker borner la rotation, sans quoi un processus qui tourne des
    # semaines finit par remplir le disque de la VM.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  etl:
    build:
      context: .
      dockerfile: services/etl/Dockerfile
    container_name: enervision-etl
    restart: "no"
    profiles: ["jobs"]
    environment:
      <<: [*artifacts, *database]
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  training:
    build:
      context: .
      dockerfile: services/training/Dockerfile
    container_name: enervision-training
    restart: "no"
    profiles: ["jobs"]
    depends_on:
      mlflow:
        condition: service_healthy
    # La base n'est lue par aucun entraînement : elle ne sert qu'à `--promote`,
    # qui inscrit la version promue dans `modele`. Elle est déclarée quand
    # même, et avec le même `:?` que pour les autres services : une promotion
    # lancée sans base s'arrête avant d'apprendre, plutôt que de poser l'alias
    # et de laisser le miroir en arrière.
    environment:
      <<: [*artifacts, *database]
      MLFLOW_EXPERIMENT: ${MLFLOW_EXPERIMENT:-enervision-consumption}
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Surveillance de dérive. Même image que l'entraînement — c'est le même
  # paquet — mais un entrypoint différent : `python -m training.drift` là où
  # l'image sert `python -m training`.
  #
  # Derrière le profil `jobs` comme les trois autres traitements datés, et
  # pour la même raison. Mais à la différence d'un entraînement, celui-ci a
  # vocation à tourner tous les jours : c'est l'ordonnanceur de
  # l'infrastructure qui le déclenche (`docker compose --profile jobs run
  # --rm drift`), comme il déclenche la collecte de la veille. Un indicateur
  # de dérive affiché sur un dashboard mais produit à la main vieillit en
  # silence, ce qui est pire que pas d'indicateur du tout.
  #
  # Le code de sortie porte le verdict : 0 stable, 2 dérive — d'ensemble ou
  # d'un seul site — 1 le calcul lui-même a échoué. L'ordonnanceur décide
  # là-dessus, sans lire le journal.
  drift:
    build:
      context: .
      dockerfile: services/training/Dockerfile
    container_name: enervision-drift
    restart: "no"
    profiles: ["jobs"]
    depends_on:
      mlflow:
        condition: service_healthy
    entrypoint: ["python", "-m", "training.drift"]
    # La base n'est pas lue : la surveillance relit les partitions de
    # variables publiées par l'ETL, pas la couche brute. Elle est déclarée
    # comme ailleurs pour que la pile échoue au démarrage plutôt qu'en cours.
    environment:
      <<: [*artifacts, *database]
      MLFLOW_DRIFT_EXPERIMENT: ${MLFLOW_DRIFT_EXPERIMENT:-enervision-drift}
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  serving:
    build:
      context: .
      dockerfile: services/serving/Dockerfile
    container_name: enervision-serving
    restart: unless-stopped
    # depends_on et non condition: service_healthy : le service démarre même
    # sans registre joignable, refuse les prévisions en 503 et le dit dans son
    # journal. Lier son démarrage à MLflow le ferait redémarrer en boucle
    # pendant une panne du registre, sans qu'aucune sonde ne réponde.
    depends_on:
      - mlflow
    environment:
      <<: *artifacts
      SERVING_MODEL_URI: ${SERVING_MODEL_URI:-models:/enervision_xgboost@champion}
      # Clé de service exigée par le contrôle d'accès. Le `:?` fait échouer le
      # démarrage en nommant la variable : le service relaie la simulation de
      # pic, qui écrit sur la source, et un conteneur qui partirait ouvert le
      # servirait à qui le demande.
      #
      # Sur un poste où l'on ne veut pas gérer de clé, poser
      # SERVING_AUTH_ENABLED=false dans .env — jamais en déploiement, le
      # service le journalise en avertissement à chaque démarrage.
      SERVING_API_KEY: ${SERVING_API_KEY:-}
      SERVING_AUTH_ENABLED: ${SERVING_AUTH_ENABLED:-true}
      SERVING_FEATURE_CACHE_TTL_S: ${SERVING_FEATURE_CACHE_TTL_S:-300}
      # La source, que le service relaie pour le compte de l'API métier. Sans
      # elle, GET /api/v1/sites et POST /api/v1/simulate/spike répondent 502 —
      # elle manquait à ce service alors que ses deux routes en dépendent.
      MOCK_API_URL: ${MOCK_API_URL_CONTAINER:?definir MOCK_API_URL_CONTAINER dans .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SERVING_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 15s
      timeout: 5s
      retries: 5

  garage:
    # Stockage objet des partitions de variables. Les quatre services
    # traversent exactement le même code que sur le disque : seule la valeur de
    # storage.root change, de `data` à `s3://enervision`. Derrière un profil,
    # parce que le disque suffit au développement courant.
    image: dxflrs/garage:v1.0.1
    container_name: enervision-garage
    profiles: ["garage"]
    restart: unless-stopped
    ports:
      - "${GARAGE_S3_PORT:-3900}:3900"
      - "${GARAGE_ADMIN_PORT:-3903}:3903"
    volumes:
      # Garage lit toute sa configuration dans ce fichier : contrairement à
      # d'autres stockages objet, il n'accepte pas d'être réglé par
      # l'environnement seul.
      - ./deploy/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  garage-init:
    # Un nœud Garage neuf n'a ni disposition, ni seau, ni clé : il faut les
    # poser une fois. Le script est idempotent, donc relançable après un
    # `docker compose down` qui aurait gardé les volumes.
    image: dxflrs/garage:v1.0.1
    container_name: enervision-garage-init
    profiles: ["garage"]
    depends_on:
      garage:
        condition: service_healthy
    volumes:
      - ./deploy/garage.toml:/etc/garage.toml:ro
      - ./deploy/garage-init.sh:/garage-init.sh:ro
    entrypoint: ["/bin/sh", "/garage-init.sh"]
    environment:
      GARAGE_BUCKET: ${GARAGE_BUCKET:-enervision}
      GARAGE_KEY_NAME: ${GARAGE_KEY_NAME:-predict}

volumes:
  # Volumes nommés : le backend store MLflow et le stockage objet survivent à
  # docker compose down et n'entrent jamais dans Git. Garage sépare ses
  # métadonnées de ses données, et les deux doivent survivre ensemble : perdre
  # les métadonnées rendrait les blocs illisibles.
  mlruns:
    driver: local
  garage-meta:
    driver: local
  garage-data:
    driver: local
