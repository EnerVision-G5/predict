name: ci

on:
  push:
  pull_request:

env:
  # Branche du repo enervision qui porte le contrat gelé de référence.
  CONTRACTS_REF: develop
  # uv.lock fige la pile entière : la CI installe exactement ce qui tournera
  # dans les images, et `--frozen` échoue si le lock a dérivé des manifestes.
  UV_FROZEN: "1"

jobs:
  lint-test:
    name: Lint et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Installer le workspace
        # 3.11 comme les autres repos du projet. Les versions épinglées sont
        # choisies pour tenir sur cette version : monter numpy ou xgboost
        # impose de monter Python ici d'abord.
        run: uv sync --python 3.11

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tests (pytest)
        # La suite couvre les quatre services et la bibliothèque partagée, dont
        # les tests d'architecture qui vérifient qu'aucun service n'importe le
        # code d'un autre, et que seuls le collecteur et l'ETL joignent la base.
        #
        # Aucun test ne joint PostgreSQL : la base est remplacée par un moteur
        # qui mémorise les instructions. Ce qui compte n'est pas que PostgreSQL
        # les accepte — c'est son métier, et le schéma figé le garantit — mais
        # que chaque service produise la bonne.
        run: uv run pytest

  build-images:
    name: Build des images
    runs-on: ubuntu-latest
    # Le build est ce qui vérifie vraiment la séparation : chaque image ne
    # copie que la bibliothèque partagée et son propre service. Un import d'un
    # service vers un autre passerait les tests sur un poste, où les quatre
    # sont installés ensemble, et échouerait ici.
    strategy:
      fail-fast: false
      matrix:
        service: [collector, etl, training, serving]
    steps:
      - uses: actions/checkout@v4

      - name: Libérer de la place sur le runner
        # Un runner GitHub n'a qu'une quinzaine de gigaoctets libres, dont une
        # bonne part occupée par des outils dont aucun build ici ne se sert :
        # .NET, Android, GHC, les images Docker préchargées. `load: true`
        # exporte l'image en archive avant de l'importer, donc la pile
        # scientifique tient deux fois sur le disque au moment le plus tendu.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc             /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Construire l'image ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: enervision-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          # mode=min et non max : le cache d'actions est plafonné à 10 Go pour
          # tout le dépôt, et quatre images exportant chacune leurs couches
          # intermédiaires s'évinceraient mutuellement — on paierait le stockage
          # pour un cache qui ne resservirait jamais.
          cache-to: type=gha,mode=min,scope=${{ matrix.service }}

      - name: Vérifier que le point d'entrée démarre
        # Un service qui ne sait pas afficher son aide ne démarrera pas non
        # plus en production, et l'échec serait alors découvert au déploiement.
        run: |
          if [ "${{ matrix.service }}" = "serving" ]; then
            docker run --rm --entrypoint python enervision-serving:ci \
              -c "import serving.api; print('serving importable')"
          else
            docker run --rm enervision-${{ matrix.service }}:ci --help
          fi

  contract-drift:
    name: Dérive du contrat OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Le paquet `serving` seul : régénérer la spécification n'a aucune raison
      # d'installer la pile ETL ni scikit-learn.
      - run: uv sync --python 3.11 --package serving

      - name: Récupérer le contrat gelé
        uses: actions/checkout@v4
        with:
          repository: EnerVision-G5/enervision
          ref: ${{ env.CONTRACTS_REF }}
          path: enervision
          # Le GITHUB_TOKEN par défaut ne lit pas les autres repos privés de
          # l'organisation. On passe par une clé de déploiement en lecture
          # seule posée sur enervision, dont la partie privée est le secret
          # ci-dessous. Une clé de déploiement n'est liée à aucun compte,
          # contrairement à un PAT qui expire ou disparaît avec son porteur.
          ssh-key: ${{ secrets.CONTRACTS_SSH_KEY }}

      - name: Comparer le code au contrat gelé
        run: |
          uv run --package serving python scripts/export_openapi.py \
            > /tmp/openapi-current.json
          diff -u enervision/docs/contracts/openapi-predict.json \
            /tmp/openapi-current.json \
            || { echo "::error::Le code a dérivé du contrat gelé. Ouvrir une PR sur enervision/docs/contracts ou corriger le code."; exit 1; }
