# Bibliothèque partagée par les quatre services.
#
# Elle ne porte aucune logique métier : ni règle de qualité, ni calcul de
# variable, ni appel à la source. Uniquement ce dont les quatre ont
# strictement besoin pour se comprendre — la configuration, la construction
# des chemins, les schémas de chaque couche et la lecture/écriture parquet.
#
# Toute fonction qui n'aurait qu'un seul appelant n'a rien à faire ici : elle
# appartient au service qui l'appelle. C'est ce qui empêche cette
# bibliothèque de redevenir le monolithe que la découpe vient de défaire.

[project]
name = "predict-common"
version = "0.1.0"
description = "Socle partagé : configuration, chemins, schémas, entrées-sorties."
requires-python = ">=3.11"
dependencies = [
    "PyYAML==6.0.3",
    "numpy==2.4.6",
    # pandas reste en 2.3 : mlflow 3.15 exige pandas<3.
    "pandas==2.3.3",
    "pyarrow==22.0.0",
    "pandera[pandas]==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predict_common"]
