# Analyse SonarQube Cloud du repo predict.
#
# Le fichier est ici et non dans le workflow parce que l'analyse doit pouvoir
# se rejouer à la main, depuis un poste, avec exactement les mêmes règles que
# la CI. Un réglage qui ne vivrait que dans le YAML donnerait deux analyses
# différentes selon d'où on la lance, et la porte qualité perdrait son sens.
#
# La clé de projet et l'organisation sont celles que SonarQube Cloud a créées
# à l'import de l'organisation GitHub. Les vérifier sur la page du projet si
# l'analyse échoue en « project not found » : ce sont les deux seules valeurs
# que ce fichier ne peut pas déduire.
sonar.projectKey=enervision-g5
sonar.organization=enervision-g5
sonar.projectName=predict

sonar.sourceEncoding=UTF-8
# La version compte : Sonar n'applique pas les mêmes règles à du code 3.11 et
# à du code 3.8, et sans elle il suppose la plus permissive.
sonar.python.version=3.11

# --- Ce qui est analysé, et à quel titre -----------------------------------
#
# Les tests vivent à l'intérieur des paquets qu'ils testent — `libs/*/tests`,
# `services/*/tests` — et non dans un arbre séparé. Sonar exige pourtant que
# sources et tests soient disjoints. D'où ce découpage en deux temps : les
# mêmes répertoires sont déclarés des deux côtés, puis `test.inclusions`
# tranche, et `exclusions` retire du périmètre des sources ce qu'il a retenu.
#
# Cette séparation n'est pas cosmétique. Un fichier de tests analysé comme du
# code de production ferait remonter des « duplications » entre deux tests qui
# partagent un montage, et une complexité qui décrit la suite, pas le produit.
sonar.sources=libs,services,scripts
sonar.tests=tests,libs,services
sonar.test.inclusions=**/tests/**

sonar.exclusions=**/tests/**,data/**,mlruns/**,notebooks/**,**/__pycache__/**

# --- Couverture -------------------------------------------------------------
#
# Produite par le job lint-test et transportée jusqu'ici comme artefact : le
# scanner ne rejoue pas la suite. La rejouer donnerait une seconde mesure, sur
# un second environnement, qui pourrait diverger de celle qui a fait passer la
# CI — et personne ne saurait laquelle fait foi.
sonar.python.coverage.reportPaths=coverage.xml

# `services/*/src/*/__main__.py` est exclu de la mesure côté coverage.py, pas
# ici : les points d'entrée restent analysés pour leurs bugs et leur style,
# ils ne sont simplement pas comptés dans la couverture, faute d'être
# exécutables sous pytest sans base ni registre.
