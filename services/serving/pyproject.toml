# Service d'inférence.
#
# fastapi et pydantic sont épinglés à la version exacte parce que ce sont eux
# qui génèrent la spécification OpenAPI. Une montée de version, même en patch,
# peut produire un JSON différent (ordre, titres générés, forme des anyOf,
# version d'OpenAPI émise) alors qu'aucun DTO n'a bougé. Le job CI
# contract-drift comparerait alors le code au contrat gelé et échouerait sur
# une dérive qui n'existe pas, et une régénération du contrat masquerait la
# vraie cause en la faisant passer pour une évolution métier.
#
# NE PAS DÉ-ÉPINGLER SANS PR DE CONTRAT. Pour monter fastapi ou pydantic :
# ouvrir une PR sur enervision/docs/contracts qui contient à la fois le bump
# de version ici et le contrat régénéré, et la faire relire par les trois
# consommateurs comme n'importe quelle évolution de contrat.
#
# mlflow complet, et non mlflow-skinny, bien que le service ne soit qu'un
# client du registre. La variante skinny a été essayée : elle résout l'alias
# sans peine, puis échoue à télécharger l'artefact du modèle
# (`No such artifact: ''`). Elle n'embarque pas de quoi rapatrier un
# `models:/…`, ce qui est précisément ce que le service fait au démarrage.
#
# Le coût est d'environ 200 Mo — Flask, gunicorn, scikit-learn, matplotlib —
# dont rien ici ne se sert. C'est un poids assumé : une image plus petite qui
# ne sait pas charger son modèle ne sert à rien.
#
# xgboost reste : le format pyfunc restitue le modèle par sa saveur d'origine,
# qui a besoin de la bibliothèque qui l'a produit.
#
# Ni driver base ni httpx : le service ne parle ni à la source ni à
# PostgreSQL. Il calcule une prévision et la rend ; l'archiver est le métier
# de l'API EnerVision, qui sert ce contrat à ses consommateurs.

[project]
name = "serving"
version = "0.1.0"
description = "Service d'inférence EnerVision."
requires-python = ">=3.11"
dependencies = [
    "predict-common",
    "fastapi==0.121.2",
    "pydantic==2.12.4",
    "uvicorn[standard]==0.38.0",
    "mlflow==3.15.2",
    "xgboost==3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serving"]

[tool.uv.sources]
predict-common = { workspace = true }
